<div class="shell">
  <nav class="sidebar" aria-label="Main">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4" /></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Smart Care Analytics</span>
        <span class="brand-sub">Hospital Operations</span>
      </div>
    </div>

    @for (item of nav; track item.path) {
      <a class="nav-link" [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
        <span>{{ item.label }}</span>
      </a>
    }

    <div class="spacer"></div>
    <div class="powered">
      <span class="powered-label">Powered by</span>
      <!-- Replace public/xt-global-logo.png with the original high-resolution logo file. -->
      <img src="xt-global-logo.png" alt="XT Global" class="powered-logo" />
    </div>
  </nav>

  <main class="content">
    @if (mock) {
      <div class="mock-banner" role="status">Showing synthetic POC data from the mock API</div>
    }
    <div class="scroll">
      <router-outlet />
    </div>
  </main>
</div>
